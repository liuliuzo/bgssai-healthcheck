name: Page contract

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  page-contract:
    name: Page contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 1

      - name: Checkout page contract checker
        uses: actions/checkout@v4
        with:
          repository: liuliuzo/bgssai-skeleton
          ref: develop
          path: checker
          fetch-depth: 1
          persist-credentials: false
          ssh-key: ${{ secrets.PAGE_CONTRACT_SKELETON_KEY }}

      - name: Check prototype routes and APIs
        run: python3 checker/scripts/check_page_contract.py --repo product
