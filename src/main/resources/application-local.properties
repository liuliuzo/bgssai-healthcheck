# ==== 中间件与数据库：由本平台直连探测，不经过应用的健康接口 ====
#
# 为什么这几条必须单列，而不是从上面 18 个后端的就绪探针里读出来：
#
# 1. 按 Standards §13.2，就绪探针**只由 critical 组件决定结论**，而 critical 只有 db 与 mybatis；
#    Redis、Elasticsearch 这类依赖一律非 critical，既不参与判定、也不在就绪端点被检查——
#    也就是说 Redis 挂了，应用的就绪探针照样返回 UP，看板上一片绿。
# 2. 按 Standards §13.4，健康负载禁止回显连接串、主机、端口与数据库版本，
#    所以即使去查应用侧，也拿不到中间件本身的水位（内存占用、连接数、集群颜色）。
#
# 因此中间件与数据库的可用性只能由本平台自己连过去看：
#   mysql://   走 JDBC 建连接、跑 SELECT 1，并核对 information_schema 里的库是否齐全
#              （bgssai-database 仓的 clean 流水线会 DROP DATABASE，库被清掉时
#               应用要到下次访问才报错，expected-databases 能提前发现）
#   redis://   走 RESP 发 AUTH / PING / INFO，按内存占用、主从链路、持久化状态判降级
#   type=elasticsearch  走 _cluster/health，按 green / yellow / red 判定
#
# 口令为什么直接写在这里：Standards §1 全局禁用配置占位符，环境差异一律在 profile 文件里
# 写死最终字面量。这些口令的权威出处是 bgssai-logs 仓的 inventory/infra.md。
# 看板、REST 接口与 /api/report.md 都不会回显它们——探针在写入原始明细之前统一做了脱敏。
#
# critical 同样一律 false：中间件挂了不该把本平台自己拖成 DOWN。

