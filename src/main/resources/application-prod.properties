# BGSSAI 健康巡检平台 —— 生产环境（华为云-境内-上海一 / 腾讯云）巡检目标（profile: prod）
#
# 启动：SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）。
#
# 本文件只放**随环境变化**的项（Standards §1：环境差异一律下沉到 profile 文件）。巡检行为的阈值
# （间隔、并发、超时等）留在 application.properties 主配置里；applications 则必须**整份**重写一遍
# （含 [0] 平台自身），不能只写差异，原因见下方 [0] 的说明。
#
# 生产目标与主配置里的基线 19 条**逐条一致**（主配置的基线就是生产），两边由
# src/test/java/com/bgssai/healthcheck/config/ConfigurationFilesConsistencyTests.java 守护：
# 改了这里忘了改主配置（或反过来），mvn test 直接失败。
#
# 写法约束与主配置一致：数组带下标 [n] 逐项展开（§4）、不出现 ${} 占位符（§1）、
# **非 ASCII 的值写 \uXXXX 转义**（.properties 按 ISO-8859-1 解码），注释里的中文照常直接写。
#
# ---- 三个决定 URL 长相的事实 ----
#
# 1. **端口 443 + HTTPS**：18 个后端在 dev / prod 都是 server.port=443 且 server.ssl.enabled=true
#    （各产品仓 application-prod.properties 实测），不是 8080 / 8081——那是本地开发端口。
#
# 2. **用公网 IP，不用私网 IP**：境内华为云私网是 172.31.x、境外华为云是 192.168.0.x，属两个
#    不同区域 / VPC，一台机器走不通对面私网；腾讯云 SaaS 更是只有公网 IP。只有公网 IP 这一套
#    地址能同时覆盖三处。**若本平台部署在某一侧 VPC 内**，把该侧条目的 url 换成下面注释里
#    标注的私网 IP 即可（每条都写了），可省公网流量。
#
# 3. **skip-tls-verification=true**：证书签给的是业务域名（www.bgssai-blog.com / www.bgssai-geo.cn
#    / www.bgssai-geo.com 等），而这里按机器 IP 直连，TLS 握手会因主机名不匹配失败——健康的应用
#    会被整片误判为 DOWN。放开只影响本平台这一个出站客户端，不改任何被监控方：三个健康端点本就
#    公开、响应体按 Standards §13.4 只含白名单字段、探针只做 GET 且不带业务令牌。
#    **想收紧的正解是给每台机器配域名、按域名探测**，那时把本行删掉即可（见 README）。
#
# critical 一律 false：本平台的 /actuator/health 只该反映「平台自己能不能巡检」，不该因为某个
# 下游应用挂了就对外报 DOWN，否则编排系统会去重启这个本来正常的平台。


# [0] 平台自身（健康巡检平台 / 平台）
#
# **为什么本档要把 applications 整份重写一遍、连平台自身 [0] 也不例外**：Spring Boot 绑定集合时
# **不跨 property source 合并**——它只从优先级最高的那个源整份取。profile 文件优先级高于主配置，
# 一旦本档出现 applications 键，主配置里的基线 19 条就整份失效；此时本档若只写 [1..18]、指望 [0]
# 从主配置补上，绑定器就会在下标 0 处遇到空洞，整份 applications 绑成空列表并抛
# 「The elements [applications[1].* ...] were left unbound」启动失败。
# 所以每个文件里的 applications 都必须是**自洽的整份**，不能跨文件拆。
#
# 本条监控平台自己的聚合健康端点，而该端点又包含 monitoredApplications 这个贡献者。
# 若标成 critical=true，一旦本平台报过一次 DOWN 就会被自己记下来，再也回不到 UP。
#
# url 里写死 8080 而不是引用 server.port：Standards §1 全局禁用 ${} 占位符。改端口时两处一起改。
bgssai.healthcheck.applications[0].id=healthcheck-platform
bgssai.healthcheck.applications[0].name=\u5065\u5eb7\u5de1\u68c0\u5e73\u53f0
bgssai.healthcheck.applications[0].group=\u5e73\u53f0
bgssai.healthcheck.applications[0].url=http://127.0.0.1:8080/actuator/health
bgssai.healthcheck.applications[0].enabled=true
bgssai.healthcheck.applications[0].critical=false
bgssai.healthcheck.applications[0].tags[0]=spring-boot
bgssai.healthcheck.applications[0].tags[1]=actuator
bgssai.healthcheck.applications[0].description=\u5e73\u53f0\u81ea\u8eab\u7684 Actuator \u5065\u5eb7\u7aef\u70b9

