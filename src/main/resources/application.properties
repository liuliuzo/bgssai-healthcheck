# BGSSAI 健康巡检平台 —— 全部配置项
#
# 本仓统一使用 .properties，不使用 .yml / .yaml（团队口径）。三条与之配套的硬性写法：
#
# 1. 数组 / List 型配置一律按 Standards §4 逐项展开为带下标 [n] 的形式，禁止单行逗号分隔。
# 2. 值一律写最终字面量，禁止出现 ${...} 占位符（Standards §1），键、值、注释三处均禁；
#    环境差异走 application-{profile}.properties。
# 3. **非 ASCII 的值必须写成 \uXXXX 转义**，不能直接写中文字面量。原因是 Spring Boot 按
#    java.util.Properties 规范以 ISO-8859-1 解码 .properties（而 .yml 一律 UTF-8），
#    直接写中文会被读成乱码——本平台的看板名称、分组名都是配置值，一旦乱码整个看板都不可读。
#    注释里的中文不受影响（注释行不会被解析成值），所以下面每条都在注释里给出可读的中文名。
#    改动这些值时请用 `native2ascii`，或 `python3 -c "print(s.encode('unicode_escape').decode())"`。
#    ASCII 值（url / id / tags / 布尔 / 时长）照常直接写。

server.port=8080
server.shutdown=graceful

spring.application.name=bgssai-healthcheck
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.bgssai.healthcheck=INFO

# ==== 巡检行为 ====
# 是否启用后台定时巡检，关闭后仍可通过 POST /api/refresh 手动触发
bgssai.healthcheck.scheduled=true
# 上一轮结束到下一轮开始的间隔
bgssai.healthcheck.refresh-interval=30s
# 启动后首轮巡检的延迟
bgssai.healthcheck.initial-delay=3s
# 单轮巡检的最大并发探测数
bgssai.healthcheck.concurrency=16
# 每个应用保留的历史采样点数量
bgssai.healthcheck.history-size=60
# 看板自动刷新间隔（秒），0 表示关闭自动刷新
bgssai.healthcheck.ui-refresh-seconds=10

bgssai.healthcheck.probe.connect-timeout=3s
bgssai.healthcheck.probe.read-timeout=5s
# 健康检查一般不希望跟随跳转（跳到登录页会被误判为正常）
bgssai.healthcheck.probe.follow-redirects=false
bgssai.healthcheck.probe.max-body-bytes=65536

# ==== 原始明细的保留策略 ====
# 明细是排障时唯一能回答「对端到底说了什么」的东西，但它按目标常驻内存，所以要给上限。
# 注意 max-body-chars 只影响「保留多少」，不影响「读取多少」——判定状态用的始终是完整响应体
# （读取上限由上面的 probe.max-body-bytes 控制）。
bgssai.healthcheck.detail.enabled=true
# 单条明细保留的最大字符数，超出部分截断并在页面与报告里标注
bgssai.healthcheck.detail.max-body-chars=16384
# 是否额外保留最近一次失败的明细：目标恢复后 latest 就变成一次成功的探测，
# 这份留档是唯一能回溯「刚才究竟错在哪里」的东西
bgssai.healthcheck.detail.keep-last-failure=true

# ==== 中间件探针的判定阈值 ====
# Redis 已用内存占 maxmemory 的比例达到该百分比即判降级（未设置 maxmemory 时不判定）
bgssai.healthcheck.redis.memory-warn-percent=90
# MySQL 当前连接数占 max_connections 的比例达到该百分比即判降级
bgssai.healthcheck.mysql.connection-warn-percent=90
# MySQL 单条校验语句的超时（秒）
bgssai.healthcheck.mysql.query-timeout-seconds=3

# ==== 告警 ====
# 巡检发现问题之后总得有人知道。默认只开日志通道：告警行会落进
# /opt/bgssai/log/bgssai-healthcheck_unstrct.log 并被 bgssai-logs 采走，
# 零配置就有一份可检索的记录，也不会往任何群里发东西。
# 要即时通知就再配下面的 webhook。整块关掉写 enabled=false。
bgssai.healthcheck.alert.enabled=true
# 连续多少次探测为异常才告警。2 而不是 1：跨境链路偶发一次超时是常态，
# 单次失败就报会把告警变成噪音；按 30s 的巡检间隔，2 次也只推迟半分钟。
bgssai.healthcheck.alert.failure-threshold=2
# 目标恢复正常时补一条恢复通知，否则只知道坏了不知道好没好
bgssai.healthcheck.alert.recovery-notice=true
# 持续异常时的重复提醒间隔，0 表示只在状态变化时通知一次。
# 保持 0：一条修不好的告警每隔几分钟响一次，最后的结果是所有人都不看告警了。
bgssai.healthcheck.alert.repeat-interval=0s
# UNKNOWN 是否计入异常。false——UNKNOWN 是「对端自报了一个不认识的状态词」，
# 把说不准当故障报会经常误伤
bgssai.healthcheck.alert.include-unknown=false
# 是否只对 critical=true 的目标告警。false，即所有启用的目标都告警
bgssai.healthcheck.alert.only-critical=false
#
# ---- Webhook 通道（留空即不启用）----
# 填上机器人地址即生效，格式见 format。注意钉钉 / 飞书的地址里带 access_token，
# 那串东西等同于一把「可以往这个群里发任意消息」的口令，本平台不会把它写进日志。
# 例：bgssai.healthcheck.alert.webhook.url=https://oapi.dingtalk.com/robot/send?access_token=xxxx
bgssai.healthcheck.alert.webhook.url=
# generic（本平台自己的 JSON，字段最全）/ wecom / dingtalk / feishu
bgssai.healthcheck.alert.webhook.format=generic
bgssai.healthcheck.alert.webhook.connect-timeout=3s
bgssai.healthcheck.alert.webhook.read-timeout=5s

# ==== 被监控的应用列表：基线 19 条（生产目标），不指定 profile 时生效 ====
#
# [0] 平台自身 + [1]..[18] 九个产品的管理端 / 用户端，共 19 条，地址取生产环境
# （华为云-境内-上海一 + 腾讯云）。**直接 java -jar、不指定 profile 启动时用的就是下面这一份**，
# 看板因此不会再显示「还没有配置被监控的应用」。
#
# 各档的覆盖关系（profile 文件优先级高于本主配置，命中即整份取代下面这 19 条）：
#
#   不指定 profile                 本文件                        生产目标
#   SPRING_PROFILES_ACTIVE=prod    application-prod.properties   生产目标，与本文件逐条一致
#   SPRING_PROFILES_ACTIVE=dev     application-dev.properties    开发目标（华为云-境外-墨西哥二 + 腾讯云）
#   SPRING_PROFILES_ACTIVE=local   application-local.properties  同 dev 目标，笔记本本机启动用
#
# **每个文件都必须写整份 19 条，不能只写差异**：Spring Boot 绑定集合时不跨 property source
# 合并，只从优先级最高的那个源整份取。所以 profile 文件里一旦出现 applications 键，本文件这
# 19 条就整份失效（而不是逐条合并）；反过来，profile 文件若只写差异（例如只覆盖 [1].url），
# 绑定器会在缺失的下标 / 字段上报 unbound 而启动失败。
#
# 本文件与 application-prod.properties 的 applications 键值必须逐条一致，由
# src/test/java/com/bgssai/healthcheck/config/ConfigurationFilesConsistencyTests.java 守护：
# 两边只要有一条对不上，mvn test（含部署构建）就直接失败，避免改了一处忘了另一处。
#
# ---- 三个决定 URL 长相的事实（与两份 profile 文件同源，改地址前先读） ----
#
# 1. **端口 443 + HTTPS**：18 个后端在 dev / prod 都是 server.port=443 且 server.ssl.enabled=true
#    （各产品仓 application-prod.properties 实测），不是 8080 / 8081——那是本地开发端口。
#
# 2. **用公网 IP，不用私网 IP**：境内华为云私网是 172.31.x、境外华为云是 192.168.0.x，属两个
#    不同区域 / VPC，一台机器走不通对面私网。只有公网 IP 这一套地址能同时覆盖两地。本平台部署
#    在境内 123.60.68.201（私网 172.31.6.116），与下面 14 条境内条目同属 172.31.x，想省公网流量
#    可把它们换成各条注释里标注的私网地址；GEO 海外与生产 SaaS（已迁华为云境外、与中间件共机）
#    这 4 条只能走公网。开发档 SaaS 仍在腾讯云、只有公网 IP。
#
# 3. **skip-tls-verification=true**：证书签给的是业务域名（www.bgssai-blog.com / www.bgssai-geo.cn
#    / www.bgssai-geo.com 等），而这里按机器 IP 直连，TLS 握手会因主机名不匹配失败——健康的应用
#    会被整片误判为 DOWN。放开只影响本平台这一个出站客户端，不改任何被监控方：三个健康端点本就
#    公开、响应体按 Standards §13.4 只含白名单字段、探针只做 GET 且不带业务令牌。
#    **想收紧的正解是给每台机器配域名、按域名探测**，那时把该条的这一行删掉即可（见 README）。
#    三台 Elasticsearch 同理：它们用的是自签证书（curl 需要 -k），所以那三条也要打开这个开关。
#
# critical 一律 false：本平台的 /actuator/health 只该反映「平台自己能不能巡检」，不该因为某个
# 下游应用挂了就对外报 DOWN，否则编排系统会去重启这个本来正常的平台。

# [0] 平台自身（健康巡检平台 / 平台）
#
# 本条监控平台自己的聚合健康端点，而该端点又包含 monitoredApplications 这个贡献者。
# 若标成 critical=true，一旦本平台报过一次 DOWN 就会被自己记下来，再也回不到 UP。
#
# url 里写死 8080 而不是引用 server.port：Standards §1 全局禁用 ${} 占位符。改端口时两处一起改。
bgssai.healthcheck.applications[0].id=healthcheck-platform
bgssai.healthcheck.applications[0].name=\u5065\u5eb7\u5de1\u68c0\u5e73\u53f0
bgssai.healthcheck.applications[0].group=\u5e73\u53f0
