# ---- 下面是几种常见配置的写法示例，按需打开（下标接着 18 往后排）----
# 注意示例里的中文同样要写成 \uXXXX：如「用户中心」= \u7528\u6237\u4e2d\u5fc3。
#
# 普通应用：
# bgssai.healthcheck.applications[19].name=\u7528\u6237\u4e2d\u5fc3
# bgssai.healthcheck.applications[19].group=\u6838\u5fc3\u670d\u52a1
# bgssai.healthcheck.applications[19].url=http://user-center.internal:8080/bgssai/health/readiness
# bgssai.healthcheck.applications[19].critical=true
# bgssai.healthcheck.applications[19].tags[0]=java
#
# 用 204 表示健康、且需要更长读超时的接口：
# bgssai.healthcheck.applications[20].name=oss-gateway
# bgssai.healthcheck.applications[20].url=https://oss-gateway.internal/healthz
# bgssai.healthcheck.applications[20].method=GET
# bgssai.healthcheck.applications[20].expected-statuses[0]=200
# bgssai.healthcheck.applications[20].expected-statuses[1]=204
# bgssai.healthcheck.applications[20].read-timeout=10s
#
# 需要 Basic 认证与自定义请求头：
# bgssai.healthcheck.applications[21].name=report-service
# bgssai.healthcheck.applications[21].url=http://report.internal:9000/bgssai/health/readiness
# bgssai.healthcheck.applications[21].username=monitor
# bgssai.healthcheck.applications[21].password=change-me
# bgssai.healthcheck.applications[21].headers.X-Tenant=bgssai
#
# 暂时不巡检的条目：
# bgssai.healthcheck.applications[22].name=gray-env
# bgssai.healthcheck.applications[22].url=http://gray.internal:8080/bgssai/health/readiness
# bgssai.healthcheck.applications[22].enabled=false
