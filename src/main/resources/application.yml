server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: bgssai-healthcheck
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bgssai.healthcheck: INFO

bgssai:
  healthcheck:
    # 是否启用后台定时巡检，关闭后仍可通过 POST /api/refresh 手动触发
    scheduled: true
    # 上一轮结束到下一轮开始的间隔
    refresh-interval: 30s
    # 启动后首轮巡检的延迟
    initial-delay: 3s
    # 单轮巡检的最大并发探测数
    concurrency: 16
    # 每个应用保留的历史采样点数量
    history-size: 60
    # 看板自动刷新间隔（秒），0 表示关闭自动刷新
    ui-refresh-seconds: 10

    probe:
      connect-timeout: 3s
      read-timeout: 5s
      # 健康检查一般不希望跟随跳转（跳到登录页会被误判为正常）
      follow-redirects: false
      max-body-bytes: 65536

    # 被监控的应用列表。默认只配了平台自身，接上真实应用后把下面的示例替换掉即可。
    applications:
      - id: healthcheck-platform
        name: 健康巡检平台
        group: 平台
        url: http://127.0.0.1:${server.port}/actuator/health
        # 注意：本条目监控的是平台自己的聚合健康端点，而该端点又包含
        # monitoredApplications 这个贡献者。若把它标成 critical: true，
        # 一旦本平台报过一次 DOWN 就会被自己记下来，再也回不到 UP。
        critical: false
        tags: [ spring-boot, actuator ]
        description: 平台自身的 Actuator 健康端点

      # ---- 下面是几种常见配置的写法示例，按需打开 ----
      #
      # - name: 用户中心
      #   group: 核心服务
      #   url: http://user-center.internal:8080/actuator/health
