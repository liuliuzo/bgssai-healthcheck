server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: bgssai-healthcheck
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bgssai.healthcheck: INFO

bgssai:
  healthcheck:
    # 是否启用后台定时巡检，关闭后仍可通过 POST /api/refresh 手动触发
    scheduled: true
    # 上一轮结束到下一轮开始的间隔
    refresh-interval: 30s
    # 启动后首轮巡检的延迟
    initial-delay: 3s
    # 单轮巡检的最大并发探测数
    concurrency: 16
    # 每个应用保留的历史采样点数量
    history-size: 60
    # 看板自动刷新间隔（秒），0 表示关闭自动刷新
    ui-refresh-seconds: 10

    probe:
      connect-timeout: 3s
      read-timeout: 5s
      # 健康检查一般不希望跟随跳转（跳到登录页会被误判为正常）
      follow-redirects: false
      max-body-bytes: 65536

    # 被监控的应用列表。默认只配了平台自身，接上真实应用后把下面的示例替换掉即可。
    applications:
      - id: healthcheck-platform
        name: 健康巡检平台
        group: 平台
        url: http://127.0.0.1:${server.port}/actuator/health
        # 注意：本条目监控的是平台自己的聚合健康端点，而该端点又包含
        # monitoredApplications 这个贡献者。若把它标成 critical: true，
        # 一旦本平台报过一次 DOWN 就会被自己记下来，再也回不到 UP。
        critical: false
        tags: [ spring-boot, actuator ]
        description: 平台自身的 Actuator 健康端点


      # ---- BGSSAI 产品线：9 个产品 × 管理端 / 用户端，共 18 个后端 ----
      #
      # 巡检地址统一为 /bgssai/health/readiness（Standards §13.7）：三个端点里只有它既证明进程活着、
      # 又证明关键依赖（数据库与持久化链路）可用，且 DOWN 时返回 503。存活探针在数据库不通时照样
      # 返回 200，用它巡检等于自欺；全量报告 /bgssai/health 信息更全但最坏耗时更长，适合人工排障。
      #
      # 平台能从响应体里读出各应用自报的 status：它们的健康负载放在各仓统一响应封装的 result / data
      # 字段里，HttpHealthProbe 会剥掉封装再取 status（见 unwrapEnvelope）。统一后的状态枚举只有
      # UP / DEGRADED / DOWN 三值，因此无需按仓写适配。
      #
      # critical 一律 false：本平台的 /actuator/health 只该反映「平台自己能不能巡检」，不该因为某个
      # 下游应用挂了就对外报 DOWN，否则编排系统会去重启这个本来正常的平台。
      #
      # 下面每条的 url 主机名是占位符：填入本环境真实主机后，把该条的 enabled 改为 true。

      - id: blog-admin
        name: 博客社区 管理端
        group: 博客社区
        url: http://bgssai-blog-admin.internal:8080/bgssai/health/readiness
        enabled: false
        critical: false
        tags: [ blog, admin ]
        description: bgssai-blog-admin 就绪探针

      - id: blog-user
        name: 博客社区 用户端
        group: 博客社区
        url: http://bgssai-blog-user.internal:8081/bgssai/health/readiness
