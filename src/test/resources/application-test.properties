# 测试档（@ActiveProfiles("test")）。本仓统一使用 .properties，不使用 .yml / .yaml。
#
# 只覆盖需要与主配置不同的项；主配置 application.properties 的其余键照常生效——
# 包括 applications 列表，用例通过 @DynamicPropertySource / 显式属性覆盖它。

# 测试里由用例显式触发巡检，避免后台任务干扰断言
bgssai.healthcheck.scheduled=false
bgssai.healthcheck.ui-refresh-seconds=0
bgssai.healthcheck.history-size=10
bgssai.healthcheck.probe.connect-timeout=1s
bgssai.healthcheck.probe.read-timeout=2s

# 测试档只往控制台打，不落文件：CI 容器里 /opt/bgssai/log 通常不可写，更不该让跑一遍
# mvn test 就在开发机上凭空生成一份 bgssai-healthcheck_unstrct.log。
# 其余三档（dev / local / prod）用的是 logback-spring_file.xml，见各档里的说明。
logging.config=classpath:log/logback-spring_file.xml
logging.applog.path=/opt/bgssai/log
# 这一行在 logback 配置加载完之后由 Spring Boot 再覆盖上去，故能压过 stdout 档里
# com.bgssai.healthcheck 那个 INFO 的 <logger>，用例里看得到 DEBUG 明细。
logging.level.com.bgssai.healthcheck=DEBUG
